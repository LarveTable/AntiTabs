<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AntiTabs</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header>
        <p class="eyebrow">AntiTabs</p>
        <h1>Block new tabs</h1>
        <p id="site" class="site">Loading current website...</p>
      </header>

      <label class="switch-row" for="toggle">
        <span>
          <strong id="stateLabel">Protection off</strong>
          <small>Stops popup tabs and opens new-tab links here instead.</small>
        </span>
        <input id="toggle" type="checkbox" role="switch" disabled>
        <span class="switch" aria-hidden="true"></span>
      </label>

      <section id="allowNextPanel" class="allow-next" aria-live="polite">
        <span>
          <strong id="allowNextTitle">Allow next tab</strong>
          <small id="allowNextDescription">Let one new tab open, then return to blocking.</small>
        </span>
        <button id="allowNextButton" type="button" disabled>Allow once</button>
      </section>

      <section class="stats" aria-labelledby="statsTitle">
        <div class="section-heading">
          <span>
            <h2 id="statsTitle">This session</h2>
            <small>Since the browser opened</small>
          </span>
        </div>

        <div class="stats-grid">
          <article class="stat">
            <strong id="tabsClosedCount">0</strong>
            <span>Tabs closed</span>
          </article>
          <article class="stat">
            <strong id="popupsBlockedCount">0</strong>
            <span>Popups blocked</span>
          </article>
          <article class="stat">
            <strong id="overlaysShieldedCount">0</strong>
            <span>Overlays cleared</span>
          </article>
          <article class="stat">
            <strong id="linksKeptCount">0</strong>
            <span>Links kept here</span>
          </article>
        </div>

        <div class="recent">
          <h3>Recent protections</h3>
          <ol id="recentEvents" class="recent-list"></ol>
          <p id="emptyStats" class="empty">No protections recorded yet.</p>
        </div>
      </section>

      <p id="message" class="message" hidden></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
